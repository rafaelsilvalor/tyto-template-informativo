name: informativo
version: 0.4.0
# The ocre brand of the private brand kit (Tyto ADR 0063): its logo and signature. Without
# that brand in the installed kit, the logo and the signature are placeholders.
brand: ocre
description: A court bulletin carousel at 1080×1350 — one ruling per slide on a paper card that grows with its words, and a back cover.
# Every face the slides set, so the plugin's process can measure them (Tyto ADR 0048). The
# question is italic, so its faces are declared italic: a face missing here is measured as
# nothing, the card is laid out from an estimate, and the gaps around the question go wrong.
# Newsreader and Roboto are Google families, fetched once when the machine lacks them (Tyto ADR
# 0120). CircularXX is licensed: it crosses only under `font:CircularXX`, approved at install.
faces:
  - { family: Newsreader, weight: 800 }
  - { family: Roboto, weight: 300 }
  - { family: Roboto, weight: 500 }
  - { family: Roboto, weight: 600 }
  - { family: CircularXX, weight: 400, style: italic }
  - { family: CircularXX, weight: 500, style: italic }
fonts:
  CircularXX: { alternatives: [Inter, Manrope, DM Sans] }
formats: [grid]
slots:
  # The title on every slide. With two lines or more the first is the kicker, smaller, and the
  # rest the title; one line is the title alone; set in capitals. Not written, it is
  # `Destaques do` / `Informativo`. Written with no lines, no title is drawn. The back cover
  # drops a trailing number from its last line (`Informativo TRZ 412` → `INFORMATIVO TRZ`).
  titulo: { type: rich-text }
  # The picture under the card, 1080 × 1350, full bleed. In the frontmatter: `fundo: ./arte.png`.
  # Without it, the configuration's `background`.
  fundo: { type: image }
  # One slide each, in order. A slide holds no lines of its own: its sections are the fields
  # below, each written after the slide's `::lamina`, each any number of lines. A field not
  # written is not drawn, and the sections after it close up.
  lamina: { type: rich-text, repeat: true, min: 1, max: 10 }
  # A ruling's sections, top to bottom. `tema`: the band (the area of law). `pergunta`: italic,
  # `**x**` the highlight colour. `resposta`: the block, one line per paragraph, `**x**` bold.
  # `fonte`: the case, the judge, the date.
  tema: { type: rich-text, per: lamina }
  pergunta: { type: rich-text, per: lamina }
  resposta: { type: rich-text, per: lamina }
  fonte: { type: rich-text, per: lamina }
  # The back cover's band and closing line. Not written, they say the reference's words;
  # written with no lines, they are not drawn.
  chamada: { type: rich-text, per: lamina }
  fecho: { type: rich-text, per: lamina }
adjustments:
  contracapa: { type: flag, applies: [lamina] }
# What a configuration may change (Tyto ADR 0153). Each default is the reference art's;
# `tests/values.test.ts` pins every default to the code's fallback.
values:
  # The picture under the card for every brief of a configuration; a brief's `fundo` wins.
  background: { type: image, default: assets/fundo.png }
  # The paper laid over the whole slide in multiply: its grain darkens everything under it.
  paper-texture: { type: image, default: assets/papel.png }
  card: { type: color, default: '#ebeae9' }
  back-tab: { type: color, default: '#d6d5d1' }
  accent: { type: color, default: '#b58230' }
  accent-edge: { type: color, default: '#d8ab63' }
  title-color: { type: color, default: '#b27c37' }
  ink: { type: color, default: '#4d4d4d' }
  on-accent: { type: color, default: '#ebeae9' }
  highlight-color: { type: color, default: '#ae7d2e' }
  logo: { type: color, default: '#ebeae9' }
  # The tallest the card may be, its tabs included: 135 px from each edge.
  card-max-height: { type: length, default: 1080, min: 600, max: 1350 }
  # Past that height the question and the answer shrink together, down to these floors.
  question-size: { type: length, default: 40, min: 28, max: 56 }
  question-floor: { type: length, default: 28, min: 20, max: 40 }
  # The least and the most the question may take so the right of its box is as full as it
  # can be: each size between them is laid out at its own pitch and scored by the room its
  # lines leave; the card must still fit, and near-ties keep `question-size`.
  question-min: { type: length, default: 36, min: 28, max: 40 }
  question-ceiling: { type: length, default: 48, min: 40, max: 64 }
  answer-size: { type: length, default: 32, min: 22, max: 44 }
  answer-floor: { type: length, default: 22, min: 16, max: 32 }
  # The least and the most the answer may take so the right of its block is as full as it can
  # be, chosen the same way once the question's size is set.
  answer-min: { type: length, default: 29, min: 22, max: 32 }
  answer-ceiling: { type: length, default: 36, min: 32, max: 48 }
  # The most letter spacing, in em, the question, the answer or the source may take or give so
  # that none ends on a word of its own (Tyto ADR 0167); their size never moves for it.
  orphan-tracking: { type: number, default: 0.01, min: 0, max: 0.05 }
